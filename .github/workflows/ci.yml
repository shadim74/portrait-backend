name: CI   # shown in the GitHub "Actions" tab

on:
  pull_request:
    branches: [main]   # run for PRs into main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5          # get the repo's code

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip                        # reuse downloads between runs
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: python -m pytest -q   # "python -m" lets tests import the app/ folder
